<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeToUI Motion</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">CodeToUI<span class="brand-accent"> Motion</span></div>
        <div class="project-switch-wrap">
          <button class="project-switch" id="project-switch">
            <span id="current-project">—</span><span class="project-switch-caret">▾</span>
          </button>
          <div class="project-menu" id="project-menu" hidden></div>
        </div>
        <div class="spacer"></div>
        <div class="transport">
          <button class="topbar-btn" id="to-start" title="Jump to start">⏮</button>
          <button class="topbar-btn" id="play-pause" title="Play / pause">▶</button>
          <span class="timecode" id="timecode">0.0s / 0.0s</span>
        </div>
        <div class="spacer"></div>
        <button class="topbar-btn" id="seed-flow" title="Rebuild the timeline automatically from your prototype's screens and links (replaces the current clips)">Auto-build timeline</button>
        <select class="topbar-select" id="format"><option value="mp4">MP4</option><option value="webm">WebM</option></select>
        <button class="topbar-btn" id="export" title="Render the demo to a video file">Export</button>
        <button class="topbar-btn" id="theme-mode" title="Toggle light/dark">☾ Dark</button>
        <select class="topbar-select" id="theme-style" title="Theme">
          <option value="none">Cozy Pixel</option>
          <option value="spooky">🌙 Spooky</option>
        </select>
      </header>

      <div class="work">
        <aside class="palette">
          <div class="sidebar-title">Screens</div>
          <ul id="screen-palette"></ul>
          <div class="palette-hint">Click a screen to add it as a clip.</div>
          <div class="pet-dock" id="pet-dock"></div>
        </aside>

        <section class="stage-pane" id="stage-pane">
          <div class="stage-wrap" id="stage-wrap">
            <iframe id="preview" title="Demo preview"></iframe>
          </div>
          <div class="status" id="status"></div>
        </section>

        <aside class="inspector" id="inspector">
          <div class="sidebar-title">Clip</div>
          <div id="inspector-body" class="inspector-body">
            <p class="inspector-empty">Select a clip in the timeline.</p>
          </div>
        </aside>
      </div>

      <section class="timeline" id="timeline">
        <div class="timeline-head">
          <span class="sidebar-title">Timeline</span>
          <span class="timeline-hint">drag a clip to reorder · drag its right edge to retime</span>
          <span class="timeline-spacer"></span>
          <button class="topbar-btn btn-small" id="add-music" title="Import background music">+ Music</button>
          <button class="topbar-btn btn-small" id="add-voice" title="Import a voiceover">+ Voiceover</button>
          <button class="topbar-btn btn-small" id="rec-voice" title="Record a voiceover with your mic">● Record</button>
          <input id="audio-file" type="file" accept="audio/*" class="visually-hidden" />
        </div>
        <div class="timeline-scroll" id="timeline-scroll">
          <div class="ruler" id="ruler"></div>
          <div class="track" id="track"></div>
          <div class="audio-track" id="audio-track"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/ui/main.js"></script>
  </body>
</html>
